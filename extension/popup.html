<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PicHarvest 图仓</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icons/icon48.png" width="30" height="30" alt="">
        <span class="brand-name">图仓</span>
        <span class="brand-en">PicHarvest</span>
      </div>
      <button class="icon-button" id="rescanBtn" type="button" title="重新扫描（Alt+Shift+H）" aria-label="重新扫描">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M16.2 8.1A6.5 6.5 0 1 0 16 12.5M16.2 4.4v3.7h-3.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="context" aria-live="polite">
      <div class="favicon-wrap" id="faviconWrap">
        <img id="favicon" alt="" width="22" height="22">
        <span class="favicon-fallback" aria-hidden="true">◒</span>
      </div>
      <div class="context-copy">
        <h1 id="pageTitle">正在读取当前页面…</h1>
        <p id="pageHost">请稍候</p>
      </div>
      <span class="site-pill" id="sitePill">扫描中</span>
    </section>

    <section class="toolbar" aria-label="筛选图片">
      <p class="count-line"><strong id="countNum">0</strong><span> 张可用图片</span><span class="dupe-note" id="dupeNote"></span></p>
      <label class="size-select">
        <span>最低</span>
        <select id="minSize" aria-label="最低图片尺寸">
          <option value="0">不限</option>
          <option value="400" selected>400px</option>
          <option value="800">800px</option>
          <option value="1200">1200px</option>
        </select>
      </label>
      <button class="select-all" id="selectAllBtn" type="button">全选</button>
    </section>

    <main class="content" id="content">
      <div class="skeleton-grid" id="loadingState" aria-label="正在扫描图片">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>

      <div class="grid" id="imageGrid" role="group" aria-label="提取到的图片" hidden></div>

      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="54" height="54"><rect x="7" y="11" width="50" height="40" rx="7" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="23" cy="26" r="4.5" fill="currentColor" opacity=".45"/><path d="m13 45 13-12 8 7 7-6 10 11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 52v8m0 0-3.5-3.5M40 60l3.5-3.5" stroke="#ee5b34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 id="emptyTitle">没有找到可下载的图片</h2>
        <p id="emptyText">向下滚动商品页，让懒加载的图片出现，然后再试一次。</p>
        <button class="text-button" id="emptyRetry" type="button">重新扫描</button>
      </div>

      <div class="empty-state error-state" id="errorState" hidden>
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="54" height="54"><circle cx="32" cy="32" r="23" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M32 18v18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="44" r="2.3" fill="currentColor"/></svg>
        </div>
        <h2 id="errorTitle">暂时无法读取这个页面</h2>
        <p id="errorText">请打开一个商品详情页后再试。</p>
        <button class="text-button" id="errorRetry" type="button">再试一次</button>
      </div>
    </main>

    <footer class="actionbar">
      <div class="selection-count">
        <strong id="selectedCount">0</strong>
        <span>已选</span>
      </div>
      <button class="zip-button" id="zipBtn" type="button" disabled>
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M10 3v9m0 0 4-4m-4 4L6 8M4 15.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="zipLabel">打包下载</span>
      </button>
      <button class="single-button" id="singleBtn" type="button" disabled title="逐张下载到 PicHarvest 文件夹" aria-label="逐张下载">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="3" y="5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 3h9a2 2 0 0 1 2 2v9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="progress-card" role="dialog" aria-modal="true" aria-labelledby="progressTitle">
      <div class="progress-visual" id="progressVisual">
        <svg class="progress-ring" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <circle class="ring-bg" cx="32" cy="32" r="27" fill="none" stroke-width="4"/>
          <circle class="ring-value" id="ringValue" cx="32" cy="32" r="27" fill="none" stroke-width="4" stroke-dasharray="169.65" stroke-dashoffset="169.65"/>
        </svg>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-copy">
        <h2 id="progressTitle">正在收图</h2>
        <p id="progressText">准备中…</p>
      </div>
      <div class="progress-actions" id="progressActions" hidden>
        <button class="ghost-button" id="closeOverlayBtn" type="button">完成</button>
        <button class="solid-button" id="showDownloadBtn" type="button">查看下载</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
